[package]
name = "xv6"
version = "0.1.0"
edition = "2021"
autobins = false

[lib]
name = "kernel"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
modular-bitfield = "0.11.2"

[profile.release]
panic="abort"
opt-level = "s"    # Optimize for size
codegen-units = 1  # Fewer units for better cross-function inlining
lto = true         # Enabled Link-time optimization
